[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "20" }

# SPA fallback: servir index.html para cualquier ruta (la app usa anclas, no rutas)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable para assets con hash (Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache corta para el documento
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"